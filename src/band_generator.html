<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        .wrapper {
            width: 1024px;
            height: 248px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-sizing: border-box;
        }

        .text {
            font-size: 85px;
            font-weight: 700;
            letter-spacing: -3px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .box {
            font-size: 60px;
            font-weight: 700;
            letter-spacing: -2px;
            border: 8px solid #fff;
            border-radius: 20px;
            padding: 8px 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div id="capture" class="wrapper">
        <div class="text">
            [NAMA] <div class="box">[NOMOR]</div>
        </div>
    </div>
</body>

</html>
